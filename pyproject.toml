[project]
name = "vault-query"
version = "0.1.0"
description = "Query Obsidian vault frontmatter with SQL using DuckDB"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "local-first-common>=0.1.0",
]

[project.scripts]
vq = "vault_query.main:main"
vq-fix = "vault_query.fix:main"
vq-todos = "vault_query.todos:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
local-first-common = { git = "https://github.com/jamalhansen/local-first-common.git", branch = "main" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
